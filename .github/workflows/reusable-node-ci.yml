name: Reusable Node.js CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version
        required: false
        type: string
        default: "22"
      run-lint:
        description: Run lint step
        required: false
        type: boolean
        default: true
      run-test:
        description: Run test step
        required: false
        type: boolean
        default: true
      run-build:
        description: Run build step
        required: false
        type: boolean
        default: true
      run-typecheck:
        description: Run type-check step
        required: false
        type: boolean
        default: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: ${{ inputs.run-lint }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    if: ${{ inputs.run-test }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    if: ${{ inputs.run-typecheck }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    if: ${{ inputs.run-build }}
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - name: Check for banned package versions
        run: |
          if npm ls --all 2>/dev/null | grep -qE "axios@1\.14\.1"; then
            echo "::error::BANNED: axios@1.14.1 is forbidden (security vulnerability)"
            exit 1
          fi
          echo "No banned package versions detected"
      - run: npm audit --audit-level=high
